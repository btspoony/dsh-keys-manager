name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm/action-setup must run before setup-node so that
      # setup-node's `cache: pnpm` can locate the pnpm store path.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The install/load proof runs the real CLI, and its focused step below
      # (`INSTALL_PROOF=required`) fails rather than skips when `dsh` is missing
      # on PATH. Install the CLI range the repository declares as its peer
      # instead of a second pinned literal, so a peer bump needs no CI edit.
      - name: Install the dsh CLI matching the declared peer range
        run: |
          set -euo pipefail
          range=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).peerDependencies['@deepseek-ai/dsh-llm']")
          npm install --global "@deepseek-ai/dsh@${range}"
          dsh --version

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # The install/load proof is excluded here: it is the heaviest step (both
      # packages packed, each `prepack` a full build, plus a fresh profile
      # install), so it runs once per job in the focused step below.
      - name: Test
        run: pnpm exec vitest run --exclude tests/install.test.ts

      # Workspace package dsh-llm-omp-transports. Its build bundles the pinned
      # omp Cursor transport, so it runs before the tests that check the artifact
      # loads on Node and that the committed drift manifest still matches.
      - name: Typecheck llm-omp
        run: pnpm --filter dsh-llm-omp-transports typecheck

      - name: Build llm-omp
        run: pnpm --filter dsh-llm-omp-transports build

      - name: Test llm-omp
        run: pnpm --filter dsh-llm-omp-transports test

      - name: Assert the llm-omp drift manifest is current
        run: git diff --exit-code -- packages/llm-omp/scripts/omp-manifest.json

      # The pinned catalog's row contents are the route's whole model surface:
      # a pin bump that regenerates the manifest but not this table would ship
      # stale rows under a fresh provenance hash. Both routes are generated
      # from the one pin, so both tables are diffed.
      - name: Assert the generated transport catalogs are current
        run: |
          set -euo pipefail
          pnpm --filter dsh-llm-omp-transports run generate:catalog
          git diff --exit-code -- packages/llm-omp/src/catalog/cursor.ts
          git diff --exit-code -- packages/llm-omp/src/catalog/devin.ts
          # The two diffs above only see the files they name: a catalog the
          # generator newly writes (a third route) would stay untracked and
          # escape them until a fresh clone. The directory must be clean.
          # Capture the status first: a failing `git status` inside `$( )` would
          # yield an empty string and pass `test -z`, so test the file size
          # instead — git errors then abort under `set -e`. Print the offending
          # entries too, or a red step only shows an exit code.
          git status --porcelain -- packages/llm-omp/src/catalog/ > "$RUNNER_TEMP/catalog-status.txt"
          test ! -s "$RUNNER_TEMP/catalog-status.txt" \
            || { cat "$RUNNER_TEMP/catalog-status.txt"; echo "dirty catalog entries listed above"; exit 1; }

      - name: Assert packed tarball contents
        run: |
          set -euo pipefail
          # npm pack --dry-run prints the Tarball Contents listing to STDERR on
          # npm 11 (stdout carries only the tarball filename), so capture both
          # streams; fail the job if the built entrypoint or the cordis bundle
          # patch is missing.
          npm pack --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "lib/index\.js( |$)" "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "lib/client\.js( |$)" "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "bundle/cordis\.patch\.yml( |$)" "$RUNNER_TEMP/pack-listing.txt"

      # Install/load proof: packs both packages, installs the root tarball into
      # a fresh DSH profile, and asserts the composed loader tree carries BOTH
      # components. It needs both builds above (each package's own `prepack`
      # also rebuilds) and the declared-range `dsh` installed before the suite.
      # INSTALL_PROOF=required is what makes a missing `dsh`/`pnpm` fail here
      # instead of skip; the release workflows run the plain suite without it,
      # install no CLI, and so skip this proof rather than fail before publish.
      - name: Install/load proof (packed profile mounts both components)
        env:
          INSTALL_PROOF: required
        run: pnpm exec vitest run tests/install.test.ts
