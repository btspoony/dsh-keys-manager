name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm/action-setup must run before setup-node so that
      # setup-node's `cache: pnpm` can locate the pnpm store path.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The install/load proof runs the real CLI, and `tests/install.test.ts`
      # fails (rather than skips) in CI when `dsh` is missing on PATH. Pin the
      # CLI explicitly so the proof is versioned with the change that adds it.
      - name: Install a pinned dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      # Workspace package dsh-llm-omp-transports. Its build bundles the pinned
      # omp Cursor transport, so it runs before the tests that check the artifact
      # loads on Node and that the committed drift manifest still matches.
      - name: Typecheck llm-omp
        run: pnpm --filter dsh-llm-omp-transports typecheck

      - name: Build llm-omp
        run: pnpm --filter dsh-llm-omp-transports build

      - name: Test llm-omp
        run: pnpm --filter dsh-llm-omp-transports test

      - name: Assert the llm-omp drift manifest is current
        run: git diff --exit-code -- packages/llm-omp/scripts/omp-manifest.json

      - name: Assert packed tarball contents
        run: |
          set -euo pipefail
          # npm pack --dry-run prints the Tarball Contents listing to STDERR on
          # npm 11 (stdout carries only the tarball filename), so capture both
          # streams; fail the job if the built entrypoint or the cordis bundle
          # patch is missing.
          npm pack --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "lib/index\.js( |$)" "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "lib/client\.js( |$)" "$RUNNER_TEMP/pack-listing.txt"
          grep -Eq "bundle/cordis\.patch\.yml( |$)" "$RUNNER_TEMP/pack-listing.txt"

      # Install/load proof: packs both packages, installs the root tarball into
      # a fresh DSH profile, and asserts the composed loader tree carries BOTH
      # components. It needs both builds above (each package's own `prepack`
      # also rebuilds) and the pinned `dsh` installed before the suite.
      - name: Install/load proof (packed profile mounts both components)
        env:
          CI: "true"
        run: pnpm exec vitest run tests/install.test.ts
