# pnpm workspace: the root package stays the Keys Manager plugin; `packages/*`
# holds sibling DSH plugins (starting with the llm-omp transport plugin).
packages:
  - '.'
  - 'packages/*'

# Standalone plugin repo: @deepseek-ai/* peers are provided by the DSH
# installation at runtime, so they are declared as peers rather than
# auto-installed into this checkout.
autoInstallPeers: false
nodeLinker: hoisted

allowBuilds:
  esbuild: true
# Required, not machine-local: pnpm's release-age policy rejects the exact
# @oh-my-pi 18.18.8 pins while they are still fresh, and these are the pins the
# omp transport is built against. Remove only by bumping to ages that pass.
minimumReleaseAgeExclude:
  - '@oh-my-pi/omptype@18.18.8'
  - '@oh-my-pi/pi-ai@18.18.8'
  - '@oh-my-pi/pi-catalog@18.18.8'
  - '@oh-my-pi/pi-natives-darwin-arm64@18.18.8'
  - '@oh-my-pi/pi-natives-darwin-x64@18.18.8'
  - '@oh-my-pi/pi-natives-linux-arm64@18.18.8'
  - '@oh-my-pi/pi-natives-linux-x64@18.18.8'
  - '@oh-my-pi/pi-natives-win32-arm64@18.18.8'
  - '@oh-my-pi/pi-natives-win32-x64@18.18.8'
  - '@oh-my-pi/pi-natives@18.18.8'
  - '@oh-my-pi/pi-utils@18.18.8'
  - '@oh-my-pi/pi-wire@18.18.8'
  # Same reason for the 0.2.2-rc.1 DSH cohort: it is a devDependency (it types
  # and builds both packages), so a frozen install resolves it and the
  # release-age policy refuses it while fresh. Exact versions only; drop these
  # when a later cohort bump has aged out.
  - '@deepseek-ai/dsh-brand@0.2.2-rc.1'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.1'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.1'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.1'
patchedDependencies: { '@oh-my-pi/pi-ai@18.18.8': patches/@oh-my-pi__pi-ai@18.18.8.patch }
