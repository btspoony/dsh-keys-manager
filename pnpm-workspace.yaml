# pnpm workspace: the root package stays the Keys Manager plugin; `packages/*`
# holds sibling DSH plugins (starting with the llm-omp transport plugin).
packages:
  - '.'
  - 'packages/*'

# Standalone plugin repo: @deepseek-ai/* peers are provided by the DSH
# installation at runtime, so they are declared as peers rather than
# auto-installed into this checkout.
autoInstallPeers: false
nodeLinker: hoisted

allowBuilds:
  esbuild: true
# Required, not machine-local: pnpm's release-age policy rejects the exact
# @oh-my-pi 18.20.3 pins while they are still fresh, and these are the pins the
# omp transport is built against. Remove only by bumping to ages that pass.
# Exact versions only; the @deepseek-ai/* DSH cohort needs no rows while it
# resolves under the configured policy, so re-add them only if a later bump
# trips it again.
minimumReleaseAgeExclude:
  - '@oh-my-pi/omptype@18.20.3'
  - '@oh-my-pi/pi-ai@18.20.3'
  - '@oh-my-pi/pi-catalog@18.20.3'
  - '@oh-my-pi/pi-natives-darwin-arm64@18.20.3'
  - '@oh-my-pi/pi-natives-darwin-x64@18.20.3'
  - '@oh-my-pi/pi-natives-linux-arm64@18.20.3'
  - '@oh-my-pi/pi-natives-linux-x64@18.20.3'
  - '@oh-my-pi/pi-natives-win32-arm64@18.20.3'
  - '@oh-my-pi/pi-natives-win32-x64@18.20.3'
  - '@oh-my-pi/pi-natives@18.20.3'
  - '@oh-my-pi/pi-utils@18.20.3'
  - '@oh-my-pi/pi-wire@18.20.3'
patchedDependencies: { '@oh-my-pi/pi-ai@18.20.3': patches/@oh-my-pi__pi-ai@18.20.3.patch }
